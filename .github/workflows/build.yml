name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Unzip dan pasang kode
        run: |
          mkdir work
          unzip -q spear-swap-template*.zip -d work
          ROOT=$(dirname "$(find work -name gradlew | head -n 1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          DEST=$(find "$ROOT/src" -name SpearSwapClient.java | head -n 1)
          if [ -z "$DEST" ]; then
            DEST="$ROOT/src/client/java/com/rins/spearswap/SpearSwapClient.java"
            mkdir -p "$(dirname "$DEST")"
          fi
          cp SpearSwapClient.java "$DEST"
      - name: Build
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: spear-swap-jar
          path: ${{ env.ROOT }}/build/libs/*.jar
